<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220">
  <defs>
    <linearGradient id="topLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" />
      <stop offset="50%" stop-color="#8a63d2" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" class="dot-pattern" />
    </pattern>

    <style>
      .bg-rect {
        fill: #ffffff;
        stroke: #e2e8f0;
      }
      .dot-pattern {
        fill: #cbd5e1;
        opacity: 0.55;
      }
      .name-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
        fill: #0f172a;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #475569;
      }
      .badge-bg {
        fill: #eff6ff;
        stroke: #bfdbfe;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        fill: #0969da;
      }
      .pulse-dot {
        fill: #2ea043;
      }
      .chip-bg {
        fill: #f8fafc;
        stroke: #e2e8f0;
      }
      .chip-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #334155;
      }

      @media (prefers-color-scheme: dark) {
        .bg-rect {
          fill: #0d1117;
          stroke: #30363d;
        }
        .dot-pattern {
          fill: #30363d;
          opacity: 0.7;
        }
        .name-text {
          fill: #f0f6fc;
        }
        .subtitle-text {
          fill: #8b949e;
        }
        .badge-bg {
          fill: #1f6feb1a;
          stroke: #388bfd4d;
        }
        .badge-text {
          fill: #58a6ff;
        }
        .pulse-dot {
          fill: #3fb950;
        }
        .chip-bg {
          fill: #161b22;
          stroke: #30363d;
        }
        .chip-text {
          fill: #c9d1d9;
        }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="958" height="218" rx="16" class="bg-rect" stroke-width="1.5" />

  <!-- Background Grid -->
  <rect x="2" y="5" width="956" height="213" rx="14" fill="url(#dotGrid)" />

  <!-- Top Accent Color Line -->
  <rect x="1" y="1" width="958" height="4" rx="2" fill="url(#topLineGrad)" />

  <!-- Top Status Badge -->
  <g transform="translate(48, 28)">
    <rect x="0" y="0" width="228" height="26" rx="13" class="badge-bg" stroke-width="1" />
    <circle cx="16" cy="13" r="4" class="pulse-dot" />
    <text x="28" y="17" class="badge-text">2X F-DROID PUBLISHED AUTHOR</text>
  </g>

  <!-- Main Headline -->
  <text x="48" y="98" class="name-text">Chiranth Janardhan Moger</text>

  <!-- Subtitle / Role -->
  <text x="48" y="128" class="subtitle-text">Software Engineer &amp; Systems Builder &bull; Mobile Security &bull; Distributed Systems &bull; Agentic AI</text>

  <!-- Feature Chips Row -->
  <g transform="translate(48, 156)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="34" rx="8" class="chip-bg" stroke-width="1" />
      <text x="14" y="22" class="chip-text">F-Droid (WebStack &amp; VaultX)</text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(232, 0)">
      <rect x="0" y="0" width="230" height="34" rx="8" class="chip-bg" stroke-width="1" />
      <text x="14" y="22" class="chip-text">WAF &amp; IPS (FortifyJS &amp; SQLGuard)</text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(474, 0)">
      <rect x="0" y="0" width="250" height="34" rx="8" class="chip-bg" stroke-width="1" />
      <text x="14" y="22" class="chip-text">Agentic AI &amp; Systems (MCP &amp; RAG)</text>
    </g>
  </g>
</svg>
